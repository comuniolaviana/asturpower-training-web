name: Pruebas AsturPower
on:
  push:
    branches: [desarrollo]
  pull_request:
    branches: [desarrollo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Comprobar compilación
        run: npm run build
      - name: Comprobar SQL Garmin con PostgreSQL local y datos ficticios
        run: npm run test:database:garmin
      - name: Comprobar receptor Garmin en workerd local sin peticiones externas
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run test:garmin:cloudflare

