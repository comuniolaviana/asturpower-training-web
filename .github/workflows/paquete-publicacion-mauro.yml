name: Empaquetar interfaz Mauro para transferencia segura
on:
  push:
    branches: [publicacion-assets-mauro-20261114]
    paths:
      - .github/workflows/paquete-publicacion-mauro.yml
permissions:
  contents: write
jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Comprimir únicamente los 19 archivos de interfaz existentes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,pathlib
          root=pathlib.Path('.')
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.parts[0]!='.github' and p.name not in ('paquete-publicacion-mauro.txt',))
          assert len(files)==19, f'Número inesperado de recursos: {len(files)}'
          payload=[dict(path=p.as_posix(),size=p.stat().st_size,b64=base64.b64encode(p.read_bytes()).decode()) for p in files]
          zipped=base64.b64encode(gzip.compress(json.dumps(payload,separators=(',',':')).encode(),compresslevel=9)).decode()
          (root/'paquete-publicacion-mauro.txt').write_text(zipped)
          print(f'{len(files)} archivos, paquete comprimido: {len(zipped)} caracteres')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paquete-publicacion-mauro.txt
          git commit -m "Paquete comprimido UI Mauro preparado para Cloudflare"
          git push
